<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>riffbox – sign-in</title>
<style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;max-width:40rem;margin:0 auto;padding:2rem 1rem;line-height:1.6;color:#1a1a1a;background:#fff}code{display:block;word-break:break-all;background:#f3f3f3;padding:.6rem;border-radius:4px}@media (prefers-color-scheme:dark){body{background:#121212;color:#e6e6e6}code{background:#1e1e1e}}</style>
</head>
<body>
<h1>riffbox</h1>
<p id="msg">This page completes the sign-in for riffbox. It stores no data.</p>
<code id="out" hidden></code>
<p><a href="/privacy">Privacy Policy</a> · <a href="/terms">Terms of Service</a></p>
<script>
(function(){
  var p=new URLSearchParams(location.search), out=document.getElementById('out'), msg=document.getElementById('msg');
  if(p.get('error')){msg.textContent='Sign-in was cancelled or failed: '+p.get('error');return;}
  var c=p.get('code'); if(!c) return;
  msg.textContent='Authorization code (copy it into riffbox):';
  out.textContent=c; out.hidden=false;
  history.replaceState(null,'',location.pathname);
})();
</script>
</body>
</html>
